<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed — MicroBlog</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #020617; color: #f8fafc; min-height: 100vh; }
    .layout { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 250px 1fr 290px; min-height: 100vh; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .sidebar { border-right: 1px solid #1e293b; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand { font-size: 22px; font-weight: bold; color: #38bdf8; padding: 8px 12px; margin-bottom: 16px; }
    .nav-btn { width: 100%; text-align: left; padding: 12px 16px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; background: transparent; color: #cbd5e1; margin-bottom: 6px; transition: 0.2s; }
    .nav-btn.active { background: #0f172a; color: #38bdf8; }
    .nav-btn:hover { background: #0f172a; }
    .user-box { border-top: 1px solid #1e293b; padding-top: 16px; }
    .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #0284c7; }
    .logout-btn { width: 100%; padding: 8px; border: none; border-radius: 10px; background: #1e293b; color: #f8fafc; font-weight: 600; cursor: pointer; }
    .logout-btn:hover { background: rgba(239,68,68,0.2); color: #f87171; }
    .main { border-right: 1px solid #1e293b; }
    .header { position: sticky; top: 0; background: rgba(2,6,23,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; padding: 16px; font-weight: bold; font-size: 18px; }
    .composer { padding: 16px; border-bottom: 1px solid #1e293b; }
    textarea { width: 100%; background: transparent; border: none; color: #fff; font-size: 16px; resize: none; outline: none; }
    .composer-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #1e293b; }
    .btn-primary { padding: 8px 20px; border: none; border-radius: 999px; background: #0ea5e9; color: #fff; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #38bdf8; }
    .post { padding: 16px; border-bottom: 1px solid #1e293b; display: flex; gap: 12px; }
    .post-body { flex: 1; }
    .post-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .muted { color: #94a3b8; font-size: 12px; }
    .post-text { margin: 8px 0 12px; font-size: 15px; line-height: 1.45; white-space: pre-line; }
    .actions { display: flex; gap: 20px; font-size: 13px; color: #94a3b8; }
    .action-btn { background: none; border: none; color: inherit; cursor: pointer; padding: 0; font-size: 13px; }
    .liked { color: #ec4899; font-weight: bold; }
    .comments { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .comment-item { background: #0f172a; padding: 6px 10px; border-radius: 8px; font-size: 12px; }
    .comment-form { display: flex; gap: 8px; margin-top: 8px; }
    .input { width: 100%; padding: 8px 12px; border-radius: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 13px; outline: none; }
    .right-panel { padding: 16px; }
    .panel-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; }
    .user-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
    .follow-btn { padding: 6px 14px; border-radius: 999px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; background: #fff; color: #020617; }
    .follow-btn.following { background: #1e293b; color: #fff; }
    .hidden { display: none !important; }
    .profile-form { padding: 20px; border-bottom: 1px solid #1e293b; display: flex; flex-direction: column; gap: 14px; }
    .msg-ok { background: rgba(16,185,129,0.2); border: 1px solid rgba(16,185,129,0.4); color: #6ee7b7; padding: 10px; border-radius: 10px; font-size: 13px; }
    .connections { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div>
        <div class="brand">𝕏 MicroBlog</div>
        <button id="nav-feed" onclick="showSection('feed')" class="nav-btn active">🏠 Página Inicial</button>
        <button id="nav-profile" onclick="showSection('profile')" class="nav-btn">👤 Meu Perfil & Conexões</button>
      </div>
      <div class="user-box">
        <div class="user-info">
          <img id="sidebar-avatar" class="avatar" src="" />
          <div>
            <div id="sidebar-name" style="font-weight:600;font-size:14px;">Carregando...</div>
            <div id="sidebar-username" class="muted">@user</div>
          </div>
        </div>
        <button onclick="handleLogout()" class="logout-btn">Sair da conta</button>
      </div>
    </aside>

    <main class="main">
      <section id="section-feed">
        <div class="header">Página Inicial</div>
        <form onsubmit="createPost(event)" class="composer">
          <textarea id="post-content" rows="3" maxlength="280" required placeholder="O que está acontecendo?"></textarea>
          <div class="composer-footer">
            <span id="char-count" class="muted">0/280</span>
            <button type="submit" class="btn-primary">Postar</button>
          </div>
        </form>
        <div id="posts-container"></div>
      </section>

      <section id="section-profile" class="hidden">
        <div class="header">Configurações do Perfil</div>
        <form onsubmit="updateProfile(event)" class="profile-form">
          <div id="profile-msg" class="msg-ok hidden"></div>
          <div style="display:flex;align-items:center;gap:14px;">
            <img id="profile-avatar-preview" class="avatar" style="width:60px;height:60px;" src="" />
            <div>
              <div class="muted" style="margin-bottom:4px;">Foto de perfil (opcional)</div>
              <input id="profile-avatar-input" type="file" accept="image/*" style="font-size:12px;" />
            </div>
          </div>
          <div>
            <div class="muted" style="margin-bottom:4px;">Nome de exibição (opcional)</div>
            <input id="profile-name-input" type="text" class="input" />
          </div>
          <div>
            <div class="muted" style="margin-bottom:4px;">Bio (opcional)</div>
            <input id="profile-bio-input" type="text" maxlength="160" class="input" placeholder="Conte um pouco sobre você" />
          </div>
          <div>
            <div class="muted" style="margin-bottom:4px;">Nova senha (deixe em branco para manter)</div>
            <input id="profile-password-input" type="password" minlength="4" class="input" placeholder="••••••••" />
          </div>
          <div><button type="submit" class="btn-primary">Salvar alterações</button></div>
        </form>

        <div class="connections">
          <div>
            <h4 style="margin:0 0 10px;">Seguindo (<span id="following-count">0</span>)</h4>
            <div id="following-list"></div>
          </div>
          <div>
            <h4 style="margin:0 0 10px;">Seguidores (<span id="followers-count">0</span>)</h4>
            <div id="followers-list"></div>
          </div>
        </div>
      </section>
    </main>

    <aside class="right-panel">
      <div class="panel-card">
        <h3 style="margin:0 0 10px;font-size:16px;">Quem seguir</h3>
        <input id="user-search" oninput="loadUsers()" type="text" placeholder="Buscar usuário..." class="input" />
        <div id="users-list"></div>
      </div>
    </aside>
  </div>

  <script>
    let currentUser = null;

    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== "") {
        for (const cookie of document.cookie.split(";")) {
          const c = cookie.trim();
          if (c.startsWith(name + "=")) {
            cookieValue = decodeURIComponent(c.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    function avatarUrl(user) {
      return user.avatar || `https://ui-avatars.com{encodeURIComponent(user.first_name || user.username)}&background=0284c7&color=fff`;
    }

    document.getElementById("post-content").addEventListener("input", (e) => {
      document.getElementById("char-count").textContent = `${e.target.value.length}/280`;
    });

    function showSection(sec) {
      document.getElementById("section-feed").classList.toggle("hidden", sec !== "feed");
      document.getElementById("section-profile").classList.toggle("hidden", sec !== "profile");
      document.getElementById("nav-feed").classList.toggle("active", sec === "feed");
      document.getElementById("nav-profile").classList.toggle("active", sec === "profile");
    }

    async function loadProfile() {
      const res = await fetch("/api/profile/");
      const data = await res.json();
      currentUser = data.user;

      document.getElementById("sidebar-name").textContent = currentUser.first_name || currentUser.username;
      document.getElementById("sidebar-username").textContent = `@${currentUser.username}`;
      document.getElementById("sidebar-avatar").src = avatarUrl(currentUser);
      document.getElementById("profile-avatar-preview").src = avatarUrl(currentUser);
      document.getElementById("profile-name-input").value = currentUser.first_name || "";
      document.getElementById("profile-bio-input").value = currentUser.bio || "";

      document.getElementById("following-count").textContent = data.following.length;
      document.getElementById("followers-count").textContent = data.followers.length;
            document.getElementById("following-list").innerHTML = data.following.length
        ? data.following.map(u => `<div class="comment-item" style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>@${u.username}</span><button onclick="toggleFollow(${u.id})" class="action-btn" style="color:#f87171;">Deixar</button></div>`).join("")
        : `<p class="muted">Você ainda não segue ninguém.</p>`;

      document.getElementById("followers-list").innerHTML = data.followers.length
        ? data.followers.map(u => `<div class="comment-item" style="margin-bottom:6px;">@${u.username}</div>`).join("")
        : `<p class="muted">Nenhum seguidor ainda.</p>`;
    }

    async function updateProfile(e) {
      e.preventDefault();
      const formData = new FormData();
      formData.append("first_name", document.getElementById("profile-name-input").value);
      formData.append("bio", document.getElementById("profile-bio-input").value);
      const pwd = document.getElementById("profile-password-input").value;
      if (pwd) formData.append("password", pwd);
      const file = document.getElementById("profile-avatar-input").files[0];
      if (file) formData.append("avatar", file);

      const res = await fetch("/api/profile/", {
        method: "PATCH",
        headers: { "X-CSRFToken": getCookie("csrftoken") },
        body: formData,
      });
      if (res.ok) {
        document.getElementById("profile-password-input").value = "";
        const msg = document.getElementById("profile-msg");
        msg.textContent = "Perfil atualizado com sucesso!";
        msg.classList.remove("hidden");
        loadProfile();
        loadPosts();
      }
    }

    async function loadUsers() {
      const q = document.getElementById("user-search").value;
      const res = await fetch(`/api/users/?q=${encodeURIComponent(q)}`);
      const users = await res.json();
      const container = document.getElementById("users-list");
      if (!users.length) {
        container.innerHTML = `<p class="muted" style="margin-top:10px;">Nenhum outro usuário encontrado.</p>`;
        return;
      }
      container.innerHTML = users.map(u => `
        <div class="user-row">
          <div style="display:flex;align-items:center;gap:8px;overflow:hidden;">
            <img src="${avatarUrl(u)}" class="avatar" style="width:36px;height:36px;" />
            <div>
              <div style="font-size:13px;font-weight:600;">${u.first_name || u.username}</div>
              <div class="muted">@${u.username}</div>
            </div>
          </div>
          <button onclick="toggleFollow(${u.id})" class="follow-btn ${u.is_following ? "following" : ""}">
            ${u.is_following ? "Seguindo" : "Seguir"}
          </button>
        </div>
      `).join("");
    }

    async function toggleFollow(userId) {
      await fetch(`/api/users/${userId}/follow/`, {
        method: "POST",
        headers: { "X-CSRFToken": getCookie("csrftoken") },
      });
      loadUsers();
      loadProfile();
      loadPosts();
    }

    async function loadPosts() {
      const res = await fetch("/api/posts/");
      const posts = await res.json();
      const container = document.getElementById("posts-container");
      if (!posts.length) {
        container.innerHTML = `<div style="padding:32px;text-align:center;" class="muted">Nenhuma postagem ainda. Escreva algo acima ou siga outros usuários!</div>`;
        return;
      }
      container.innerHTML = posts.map(p => `
        <article class="post">
          <img src="${avatarUrl(p.author)}" class="avatar" />
          <div class="post-body">
            <div class="post-meta">
              <div>
                <strong>${p.author.first_name || p.author.username}</strong>
                <span class="muted"> @${p.author.username} · ${new Date(p.created_at).toLocaleString("pt-BR")}</span>
              </div>
              ${currentUser && p.author.id === currentUser.id ? `<button onclick="deletePost(${p.id})" class="action-btn" style="color:#f87171;">Excluir</button>` : ""}
            </div>
            <div class="post-text">${p.content}</div>
            <div class="actions">
              <button onclick="toggleLike(${p.id})" class="action-btn ${p.is_liked ? "liked" : ""}">
                ${p.is_liked ? "❤️" : "🤍"} ${p.likes_count}
              </button>
              <span>💬 ${p.comments.length} comentários</span>
            </div>
            <div class="comments">
              ${p.comments.map(c => `<div class="comment-item"><strong style="color:#38bdf8;">@${c.author_username}:</strong> ${c.content}</div>`).join("")}
            </div>
            <form onsubmit="addComment(event, ${p.id})" class="comment-form">
              <input id="comment-input-${p.id}" type="text" required placeholder="Escreva um comentário..." class="input" />
              <button type="submit" class="btn-primary" style="padding:6px 14px;font-size:12px;">Enviar</button>
            </form>
          </div>
        </article>
      `).join("");
    }

    async function createPost(e) {
      e.preventDefault();
      const input = document.getElementById("post-content");
      const res = await fetch("/api/posts/", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
        body: JSON.stringify({ content: input.value }),
      });
      if (res.ok) {
        input.value = "";
        document.getElementById("char-count").textContent = "0/280";
        loadPosts();
      }
    }

    async function deletePost(id) {
      await fetch(`/api/posts/${id}/`, {
        method: "DELETE",
        headers: { "X-CSRFToken": getCookie("csrftoken") },
      });
      loadPosts();
    }

    async function toggleLike(id) {
      await fetch(`/api/posts/${id}/like/`, {
        method: "POST",
        headers: { "X-CSRFToken": getCookie("csrftoken") },
      });
      loadPosts();
    }

    async function addComment(e, id) {
      e.preventDefault();
      const input = document.getElementById(`comment-input-${id}`);
      const res = await fetch(`/api/posts/${id}/comment/`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
        body: JSON.stringify({ content: input.value }),
      });
      if (res.ok) {
        input.value = "";
        loadPosts();
      }
    }

    async function handleLogout() {
      await fetch("/api/logout/", {
        method: "POST",
        headers: { "X-CSRFToken": getCookie("csrftoken") },
      });
      window.location.href = "/login/";
    }

    (async () => {
      await loadProfile();
      await loadUsers();
      await loadPosts();
    })();
  </script>
</body>
</html>
